[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "degora"
version = "0.4.32"
description = "Excel-first integration of published heterogeneous DEG tables"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3.1",
  "numpy>=1.26,<3",
  "scipy>=1.11.1,<1.18",
  "pyarrow>=14.0.1,<25",
  "openpyxl>=3.1,<4",
  # read_deg_table accepts .xls, and pandas needs xlrd for it. Leaving this in the
  # dev extra meant an ordinary install advertised a format it could not open.
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "build>=1,<2",
  "pip-audit>=2.7,<3",
  "xlrd>=2.0.1,<3",
]

[project.scripts]
degora = "degora.cli:main"

[tool.setuptools]
packages = ["degora"]

[tool.pytest.ini_options]
# SciPy's moment routine warns about catastrophic cancellation on a synthetic
# fixture whose values are deliberately identical; it is not a DEGORA defect.
filterwarnings = [
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning",
]
