name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make check
      - run: make smoke

  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python3.12 --version
      - run: python3.12 -m venv .venv
      - run: .venv/bin/python --version
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -e .
      - run: make PYTHON=.venv/bin/python smoke

  # The test suite runs under ".[dev]", which installs xlrd - so a .xls branch
  # could be advertised by the package and unreachable for everyone who installs it
  # normally, with every unit test still green. Exercise the built wheel with no
  # dev extra at all.
  wheel-no-dev-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip --quiet
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -m pip list
      - name: Every reader the package advertises must be importable
        run: |
          /tmp/clean/bin/python -c "import xlrd, openpyxl; print('xlrd', xlrd.__version__, '| openpyxl', openpyxl.__version__)"
      - name: Build a real legacy .xls fixture
        # Written with a throwaway interpreter: pandas dropped its xlwt writer, and
        # the point is to hand the clean environment a genuine OLE2 workbook it had
        # no part in making.
        run: |
          python -m pip install --quiet xlwt
          python - <<'PY'
          import xlwt

          book = xlwt.Workbook()
          sheet = book.add_sheet("Sheet1")
          for column, name in enumerate(("gene", "log2FoldChange", "pvalue")):
              sheet.write(0, column, name)
          for row in range(1, 11):
              sheet.write(row, 0, f"G{row}")
              sheet.write(row, 1, 2.0 - row * 0.1)
              sheet.write(row, 2, 0.001 * row)
          book.save("legacy.xls")

          with open("legacy.xls", "rb") as handle:
              assert handle.read(4) == b"\xd0\xcf\x11\xe0", "fixture is not an OLE2 file"

          import csv

          with open("legacy_catalog.csv", "w", newline="") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "study_id", "source_unit_id", "source_path", "gene_column",
                      "lfc_column", "p_column", "n_ctrl", "n_treat",
                  ],
              )
              writer.writeheader()
              for unit in (1, 2):
                  writer.writerow({
                      "study_id": f"S{unit}", "source_unit_id": f"U{unit}",
                      "source_path": "legacy.xls", "gene_column": "gene",
                      "lfc_column": "log2FoldChange", "p_column": "pvalue",
                      "n_ctrl": 3, "n_treat": 3,
                  })
          PY
      - name: The .xls fixture validates and runs without the dev extra
        run: |
          /tmp/clean/bin/degora validate legacy_catalog.csv
          /tmp/clean/bin/degora run legacy_catalog.csv --output-dir xls-out --harmonized-dir xls-harm --no-excel
          test -f xls-out/degora_gene_scores.csv

  # The dependency pins are a range, and only its floor was exercised. A pandas or
  # numpy release inside the allowed range could break a run for anyone installing
  # today, and nothing here would have said so.
  upper-bounds-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --upgrade "pandas<3.1" "numpy<3" "scipy<1.18" "pyarrow<25" "openpyxl<4"
      - run: python -m pip list
      - run: make check
      - run: make smoke

  lower-bounds-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas==2.1.0 numpy==1.26.0 scipy==1.11.1 pyarrow==14.0.1 openpyxl==3.1.0 pytest==9.0.3 build==1.3.0 xlrd==2.0.2
      - run: python -m pip install -e . --no-deps
      - run: make check
      - run: make smoke
