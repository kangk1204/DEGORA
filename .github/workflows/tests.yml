name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make check
      - run: make smoke

  smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python3.12 --version
      - run: python3.12 -m venv .venv
      - run: .venv/bin/python --version
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/python -m pip install -e .
      - run: make PYTHON=.venv/bin/python smoke

  # The dependency pins are a range, and only its floor was exercised. A pandas or
  # numpy release inside the allowed range could break a run for anyone installing
  # today, and nothing here would have said so.
  upper-bounds-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --upgrade "pandas<3.1" "numpy<3" "scipy<1.18" "pyarrow<25" "openpyxl<4"
      - run: python -m pip list
      - run: make check
      - run: make smoke

  lower-bounds-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas==2.1.0 numpy==1.26.0 scipy==1.11.1 pyarrow==14.0.1 openpyxl==3.1.0 pytest==9.0.3 build==1.3.0 xlrd==2.0.2
      - run: python -m pip install -e . --no-deps
      - run: make check
      - run: make smoke
